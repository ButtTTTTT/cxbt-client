<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>.MESH骨骼索引名称提取</title>
    <style>
        body {
            width: 800px;
            margin: 0 auto;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px 0;
        }

        .input-area {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 50px;
            margin: 10px 0;
            font-family: monospace;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }

        #fileInput {
            display: none;
        }

        #fileLabel {
            display: block;
            padding: 40px 0;
            background-color: #eef6ff;
            color: black;
            border-radius: 4px;
            cursor: pointer;
        }

        #fileLabel:hover {
            background-color: #0056b3;
        }

        .out-div {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        #output {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 16px;
            min-height: 100px;
            max-height: 400px;
            overflow: auto;
            margin: 0 0 50px 0;
            border: 1px solid #eee;
        }

        #copyBtn {
            font-size: 18px;
            background: #ffc107;
            color: #212529;
        }

        h1,
        h3 {
            color: #333;
        }

        .stats {
            font-size: 14px;
            color: #28a745;
            margin-left: 15px;
            font-weight: 500;
            vertical-align: middle;
        }

        .dropzone {
            border: 3px dashed #007bff;
            text-align: center;
            border-radius: 8px;
            margin: 15px 0;
            background-color: #f0f8ff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dropzone:hover {
            background-color: #e1f0ff;
        }

        .drag-tip {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <h1>.MESH骨骼索引名称提取</h1>

    <div class="input-area" id="dropZone">
        <h3>方式1：📄 粘贴十六进制数据</h3>
        <textarea id="hexInput" placeholder="支持空格、换行分隔的 Hex 字符串，例如：28000000 05000000 61726D5F 6C..."></textarea>

        <h3>方式2：📂 拖拽或选择 .mesh 文件</h3>
        <div class="drag-tip">或直接将 .mesh 文件拖拽到本区域</div>

        <div class="dropzone" id="dropArea">
            <input type="file" id="fileInput" accept=".mesh" onchange="parseFromFile()">
            <label for="fileInput" id="fileLabel">📁 点击选择 .mesh 文件</label>
        </div>
        <!-- 📥 拖拽 .mesh 文件到这里 -->
    </div>

    <div class="out-div">
        <div>
            <h3 style="display:inline; margin:0;">📋 解析结果</h3>
            <span id="stats" class="stats"></span>
        </div>
        <button id="copyBtn" onclick="copyResult()" style="display:none">📋 一键复制</button>
    </div>
    <div id="output">
        （粘贴数据或上传文件后自动解析）
    </div>

    <script>
        const hexInput = document.getElementById('hexInput');
        const dropZone = document.getElementById('dropZone');
        const dropArea = document.getElementById('dropArea');

        // 输入时自动解析（带防抖）
        hexInput.addEventListener('input', () => {
            debounceParseFromHex();
        });

        let debounceTimer;
        function debounceParseFromHex() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                parseFromHex();
            }, 300); // 更快响应
        }

        function parseFromHex() {
            const hexStr = hexInput.value.trim();
            const outputDiv = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const statsDiv = document.getElementById('stats');

            if (!hexStr) {
                outputDiv.innerHTML = `ℹ️ 请粘贴十六进制数据或上传文件`;
                copyBtn.style.display = 'none';
                statsDiv.textContent = '';
                return;
            }

            try {
                const boneNames = parseBoneNamesFromHex(hexStr);
                showResult(boneNames, outputDiv, copyBtn);
            } catch (e) {
                outputDiv.innerHTML = `❌ 解析失败：${e.message}`;
                copyBtn.style.display = 'none';
                statsDiv.textContent = '';
                console.error(e);
            }
        }

        function parseFromFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const outputDiv = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');
            const statsDiv = document.getElementById('stats');

            if (!file) {
                outputDiv.innerHTML = `❌ 请选择文件！`;
                copyBtn.style.display = 'none';
                statsDiv.textContent = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const arrayBuffer = e.target.result;
                try {
                    const boneNames = parseBoneNamesFromArrayBuffer(arrayBuffer);
                    showResult(boneNames, outputDiv, copyBtn);
                } catch (e) {
                    outputDiv.innerHTML = `❌ 解析失败：${e.message}`;
                    copyBtn.style.display = 'none';
                    statsDiv.textContent = '';
                    console.error(e);
                }
            };
            reader.onerror = function () {
                outputDiv.innerHTML = `❌ 文件读取失败！`;
                copyBtn.style.display = 'none';
                statsDiv.textContent = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // 拖拽功能
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropArea.classList.add('highlight');
            dropArea.style.backgroundColor = '#d0e8ff';
        }

        function unhighlight() {
            dropArea.classList.remove('highlight');
            dropArea.style.backgroundColor = '';
        }

        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0 && files[0].name.toLowerCase().endsWith('.mesh')) {
                const fileInput = document.getElementById('fileInput');
                fileInput.files = files;
                parseFromFile();
            } else {
                alert("请拖拽 .mesh 文件！");
            }
        }

        function parseBoneNamesFromHex(hexStr) {
            let cleanHex = hexStr.replace(/\s+/g, '').toLowerCase();
            if (cleanHex.length % 2 !== 0) {
                throw new Error("十六进制数据长度不是偶数");
            }
            const bytes = new Uint8Array(cleanHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            return parseBoneNamesFromBytes(bytes);
        }

        function parseBoneNamesFromArrayBuffer(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            return parseBoneNamesFromBytes(bytes);
        }

        function parseBoneNamesFromBytes(bytes) {
            const dataView = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            let offset = 0;
            let boneNames = [];

            if (offset + 4 > bytes.length) throw new Error("数据太短，无法读取骨骼总数");
            const boneCount = dataView.getUint32(offset, true);
            offset += 4;

            for (let i = 0; i < boneCount; i++) {
                if (offset + 4 > bytes.length) throw new Error(`骨骼 #${i}：无法读取名称长度`);
                const nameLen = dataView.getUint32(offset, true);
                offset += 4;

                if (offset + nameLen > bytes.length) {
                    throw new Error(`骨骼 #${i}：名称越界！需 ${nameLen} 字节，仅剩 ${bytes.length - offset}`);
                }

                const nameBytes = bytes.slice(offset, offset + nameLen);
                offset += nameLen;

                const decoder = new TextDecoder('utf-8');
                const boneName = decoder.decode(nameBytes);
                boneNames.push(boneName);
            }

            return boneNames;
        }

        function showResult(boneNames, outputDiv, copyBtn) {
            const jsonOutput = JSON.stringify(boneNames, null, 2);
            outputDiv.innerHTML = `<pre>${jsonOutput}</pre>`;
            copyBtn.style.display = 'block';

            // ✅ 显示骨骼数量统计
            const statsDiv = document.getElementById('stats');
            statsDiv.textContent = `✅ 共提取 ${boneNames.length} 个骨骼名称`;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ 已复制到剪贴板！");
            }).catch(err => {
                console.error("复制失败:", err);
                alert("❌ 请手动选择并复制文本。");
            });
        }

        function copyResult() {
            const outputDiv = document.querySelector("#output pre");
            if (outputDiv) copyToClipboard(outputDiv.innerText);
        }
    </script>
</body>

</html>
